[package]
name = "wc2026-simulation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Monte Carlo simulator for the FIFA World Cup 2026"
repository = "https://github.com/erikbohne/wc2026-simulation"

[dependencies]
rand = "0.10"
rand_xoshiro = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "wc2026-sim"
path = "src/main.rs"
