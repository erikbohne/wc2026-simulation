name: Simulate

on:
  push:
    branches: [main]
    paths:
      - "data/results.json"
      - "data/teams.json"
      - "src/**"
  workflow_dispatch:

concurrency:
  group: simulate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run simulation
        run: |
          cargo build --release
          ./target/release/wcsim -n 100000 -s 2026 --results data/results.json -o json > data/snapshots/latest.json
          # Per-match title-race history: one snapshot for every prefix of results
          # (0..N played), so the chart has a point after every single game.
          bash scripts/gen_history.sh data/results.json 2026 100000
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "no snapshot changes"
          else
            git commit -m "data: refresh simulation snapshot"
            git push
          fi
