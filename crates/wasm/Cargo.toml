# Standalone crate (its own [workspace] so it never disturbs the native
# build/test/CI at the repo root). Compiles the pure simulation library to
# WebAssembly for the in-browser live scenario tree.
[package]
name = "wcsim-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wc2026-simulation = { path = "../.." }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
